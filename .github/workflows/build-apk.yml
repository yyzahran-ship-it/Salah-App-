name: Build APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache generated dart files
        id: cache-generated
        uses: actions/cache@v4
        with:
          path: |
            .dart_tool/build
            lib/data/sources/local/quran_database.g.dart
          key: ${{ runner.os }}-generated-${{ hashFiles('pubspec.lock', 'lib/data/sources/local/quran_database.dart') }}
          restore-keys: |
            ${{ runner.os }}-generated-

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code (build_runner)
        run: |
          if [ -f lib/data/sources/local/quran_database.g.dart ]; then
            echo "Generated file already present, skipping build_runner"
          else
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: salah-app-debug
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 7
